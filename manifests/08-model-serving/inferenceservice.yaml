apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: fraude-classifier
  namespace: repositorio
  labels:
    opendatahub.io/dashboard: "true"
  annotations:
    openshift.io/display-name: Classificador de fraude
    openshift.io/description: Classificador tabular de fraude treinado com as features do Spark.
    opendatahub.io/hardware-profile-name: default-profile
    opendatahub.io/hardware-profile-namespace: redhat-ods-applications
    security.opendatahub.io/enable-auth: "false"
    serving.kserve.io/deploymentMode: Standard
    serving.kserve.io/storageSecretName: fraude-s3
spec:
  predictor:
    minReplicas: 1
    maxReplicas: 1
    model:
      modelFormat:
        name: sklearn
        version: "1"
      runtime: fraude-sklearn
      protocolVersion: v1
      storageUri: s3://modelos/fraude
      resources:
        requests:
          cpu: 200m
          memory: 1Gi
        limits:
          cpu: "1"
          memory: 4Gi
