apiVersion: v1
kind: Secret
metadata:
  name: fraude-s3
  namespace: repositorio
  annotations:
    serving.kserve.io/s3-endpoint: aistor-s3.aistor.svc.cluster.local:9000
    serving.kserve.io/s3-usehttps: "0"
    serving.kserve.io/s3-region: us-east-1
    serving.kserve.io/s3-verifyssl: "0"
    serving.kserve.io/s3-usevirtualbucket: "false"
stringData:
  AWS_ACCESS_KEY_ID: <AISTOR_ACCESS_KEY>
  AWS_SECRET_ACCESS_KEY: <AISTOR_SECRET_KEY>
  AWS_S3_ENDPOINT: http://aistor-s3.aistor.svc.cluster.local:9000
  AWS_DEFAULT_REGION: us-east-1
type: Opaque
