apiVersion: v1
kind: ServiceAccount
metadata:
  name: fraude
  namespace: repositorio
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fraude
  namespace: repositorio
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: gp3-csi
  resources:
    requests:
      storage: 10Gi
---
apiVersion: kubeflow.org/v1
kind: Notebook
metadata:
  name: fraude
  namespace: repositorio
  labels:
    app: fraude
    opendatahub.io/dashboard: "true"
    opendatahub.io/odh-managed: "true"
  annotations:
    openshift.io/display-name: Fraude
    openshift.io/description: Lê as features de fraude no Feature Store, treina o classificador e publica o artefato no S3.
    opendatahub.io/image-display-name: Standard Data Science
    notebooks.opendatahub.io/last-image-selection: s2i-generic-data-science-notebook:3.5
    notebooks.opendatahub.io/last-image-version-git-commit-selection: 47efb6c
    notebooks.opendatahub.io/inject-auth: "true"
    opendatahub.io/hardware-profile-name: default-profile
    opendatahub.io/hardware-profile-namespace: redhat-ods-applications
spec:
  template:
    spec:
      serviceAccountName: fraude
      containers:
        - name: fraude
          image: image-registry.openshift-image-registry.svc:5000/redhat-ods-applications/s2i-generic-data-science-notebook:3.5
          imagePullPolicy: Always
          env:
            - name: NOTEBOOK_ARGS
              value: "--ServerApp.port=8888 --ServerApp.token='' --ServerApp.password='' --ServerApp.base_url=/notebook/repositorio/fraude --ServerApp.quit_button=False"
          envFrom:
            - secretRef:
                name: dados
          ports:
            - name: notebook-port
              containerPort: 8888
              protocol: TCP
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 6Gi
          readinessProbe:
            tcpSocket:
              port: notebook-port
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: notebook-port
            initialDelaySeconds: 10
            periodSeconds: 5
          volumeMounts:
            - name: fraude
              mountPath: /opt/app-root/src
            - name: shm
              mountPath: /dev/shm
        - name: kube-rbac-proxy
          image: registry.redhat.io/rhoai/odh-kube-rbac-proxy-rhel9@sha256:b64105d53ab3f7d477652b2f29c90636fe272891cce71620ceadf0bf2eb3e323
          imagePullPolicy: Always
          args:
            - --secure-listen-address=0.0.0.0:8443
            - --upstream=http://127.0.0.1:8888/
            - --logtostderr=true
            - --v=0
            - --proxy-endpoints-port=8444
            - --config-file=/etc/kube-rbac-proxy/config-file.yaml
            - --tls-cert-file=/etc/tls/private/tls.crt
            - --tls-private-key-file=/etc/tls/private/tls.key
            - --auth-header-fields-enabled=true
            - --auth-header-user-field-name=X-Auth-Request-User
            - --auth-header-groups-field-name=X-Auth-Request-Groups
          ports:
            - name: kube-rbac-proxy
              containerPort: 8443
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: kube-rbac-proxy-config
              mountPath: /etc/kube-rbac-proxy
            - name: kube-rbac-proxy-tls-certificates
              mountPath: /etc/tls/private
      volumes:
        - name: fraude
          persistentVolumeClaim:
            claimName: fraude
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
        - name: kube-rbac-proxy-config
          configMap:
            name: fraude-kube-rbac-proxy-config
            defaultMode: 420
        - name: kube-rbac-proxy-tls-certificates
          secret:
            secretName: fraude-kube-rbac-proxy-tls
            defaultMode: 420
